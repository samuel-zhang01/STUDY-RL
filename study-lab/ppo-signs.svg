<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
<title id="title">PPO clipping depends on the sign of advantage</title><desc id="desc">With epsilon 0.2, advantage plus 2 flattens above ratio 1.2; advantage minus 2 flattens below 0.8. Vertical axis is surrogate to maximise.</desc>
<rect width="800" height="300" fill="#faf9f5"/>
<g font-family="system-ui,sans-serif" font-size="15" fill="#173d38">
<text x="55" y="28" font-size="19" font-weight="600">Advantage +2</text>
<line x1="55" y1="246" x2="345" y2="246" stroke="#d3dcd6"/><text x="46" y="251" text-anchor="end">-4</text>
<line x1="55" y1="198" x2="345" y2="198" stroke="#d3dcd6"/><text x="46" y="203" text-anchor="end">-2</text>
<line x1="55" y1="150" x2="345" y2="150" stroke="#d3dcd6"/><text x="46" y="155" text-anchor="end">0</text>
<line x1="55" y1="102" x2="345" y2="102" stroke="#d3dcd6"/><text x="46" y="107" text-anchor="end">2</text>
<line x1="55" y1="54" x2="345" y2="54" stroke="#d3dcd6"/><text x="46" y="59" text-anchor="end">4</text>
<text x="55" y="270" text-anchor="middle">0</text>
<text x="127.5" y="270" text-anchor="middle">0.5</text>
<text x="200" y="270" text-anchor="middle">1</text>
<text x="272.5" y="270" text-anchor="middle">1.5</text>
<text x="345" y="270" text-anchor="middle">2</text>
<line x1="171.0" y1="50" x2="171.0" y2="250" stroke="#ad632c" stroke-dasharray="4 5"/>
<line x1="229.0" y1="50" x2="229.0" y2="250" stroke="#ad632c" stroke-dasharray="4 5"/>
<polyline points="55,150 229.0,92.4 345,92.4" fill="none" stroke="#12665b" stroke-width="4"/><text x="200" y="294" text-anchor="middle">new / old probability ratio</text>
<text x="450" y="28" font-size="19" font-weight="600">Advantage -2</text>
<line x1="450" y1="246" x2="740" y2="246" stroke="#d3dcd6"/><text x="441" y="251" text-anchor="end">-4</text>
<line x1="450" y1="198" x2="740" y2="198" stroke="#d3dcd6"/><text x="441" y="203" text-anchor="end">-2</text>
<line x1="450" y1="150" x2="740" y2="150" stroke="#d3dcd6"/><text x="441" y="155" text-anchor="end">0</text>
<line x1="450" y1="102" x2="740" y2="102" stroke="#d3dcd6"/><text x="441" y="107" text-anchor="end">2</text>
<line x1="450" y1="54" x2="740" y2="54" stroke="#d3dcd6"/><text x="441" y="59" text-anchor="end">4</text>
<text x="450" y="270" text-anchor="middle">0</text>
<text x="522.5" y="270" text-anchor="middle">0.5</text>
<text x="595" y="270" text-anchor="middle">1</text>
<text x="667.5" y="270" text-anchor="middle">1.5</text>
<text x="740" y="270" text-anchor="middle">2</text>
<line x1="566.0" y1="50" x2="566.0" y2="250" stroke="#ad632c" stroke-dasharray="4 5"/>
<line x1="624.0" y1="50" x2="624.0" y2="250" stroke="#ad632c" stroke-dasharray="4 5"/>
<polyline points="450,188.4 566.0,188.4 740,246" fill="none" stroke="#12665b" stroke-width="4"/><text x="595" y="294" text-anchor="middle">new / old probability ratio</text>
</g></svg>
