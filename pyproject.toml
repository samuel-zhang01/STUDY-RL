[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "common",
  "week-01-mdps-bandits",
  "week-02-bellman-dp",
  "week-03-monte-carlo",
  "week-14-offline-rl-1",
  "week-15-decision-transformer-diffusion",
  "week-16-model-based",
  "week-17-exploration-meta",
]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "slow: training runs that take > 30s",
  "gpu: requires CUDA",
  "smoke: minimal smoke test",
]
timeout = 600
