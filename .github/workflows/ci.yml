name: Course checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    # Public pull requests retain the original free-hosted checks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            llm-lab/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'swig==4.*'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r llm-lab/requirements.txt
          python -m pip check
      - name: Check release files and documentation
        run: make release-check PY=python
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interactive/package-lock.json
      - name: Run isolated weekly suites and offline lab tests
        run: make tests PY=python

  browser-checks:
    # Public pull requests retain the original free-hosted checks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interactive/package-lock.json
      - name: Install browser-test dependencies
        working-directory: interactive
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
      - name: Exercise the learning lab in three browsers
        run: make browser-tests PY=python

  local-cpu-checks:
    if: github.repository == 'samuel-zhang01/STUDY-RL' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [ci-study-rl]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run original cpu checks offline
        run: python3 -I -B ci/run_checks.py cpu
      - name: Reconcile only this run and attempt
        if: always()
        run: python3 -I -B ci/run_checks.py cpu --cleanup

  local-browser-checks:
    if: github.repository == 'samuel-zhang01/STUDY-RL' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [ci-study-rl]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run original browser checks offline
        run: python3 -I -B ci/run_checks.py browser
      - name: Reconcile only this run and attempt
        if: always()
        run: python3 -I -B ci/run_checks.py browser --cleanup
